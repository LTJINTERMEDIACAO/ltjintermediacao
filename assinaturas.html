<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assinaturas | Portal LTJ</title>
<style>
:root{--azul:#0640a1;--azul2:#0b54c7;--azul-escuro:#03275f;--laranja:#ff7417;--branco:#fff;--fundo:#f5f7fb;--cinza:#667085;--borda:#e4eaf2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--azul-escuro)}
a{text-decoration:none;color:inherit}
.header{background:#fff;min-height:95px;display:flex;align-items:center;justify-content:space-between;padding:12px 4.5%;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:15px}.brand img{width:95px;height:68px;object-fit:contain}.brand strong{display:block}.brand span{font-size:12px;color:#58677d}
.back{background:var(--laranja);color:#fff;padding:10px 15px;border-radius:9px;font-size:12px;font-weight:bold}
.wrap{padding:28px 4.5% 50px}.title h1{margin:0;font-size:28px}.title p{color:var(--cinza);font-size:13px}.line{width:42px;height:3px;background:var(--laranja);margin:12px 0 20px}
.search{width:100%;max-width:520px;height:46px;border:1px solid var(--borda);border-radius:10px;padding:0 14px;outline:none;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{background:#fff;border:1px solid var(--borda);border-radius:15px;padding:16px;box-shadow:0 6px 18px rgba(6,40,95,.05)}
.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card h3{margin:0 0 5px;font-size:15px}.meta{font-size:10px;color:var(--cinza)}
.badge{background:#edf4ff;color:var(--azul2);font-size:9px;font-weight:bold;padding:7px 9px;border-radius:20px;white-space:nowrap}
.imgbox{margin-top:12px;border:1px dashed #dce2eb;border-radius:10px;padding:10px;min-height:150px;display:flex;align-items:center;justify-content:center}
.imgbox img{width:100%;max-height:190px;object-fit:contain}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions a,.actions button{border:1px solid var(--borda);background:#fff;color:var(--azul2);padding:8px 10px;border-radius:8px;font-size:10px;cursor:pointer}
.note{background:#fff0e3;color:#7b3a00;border-radius:9px;padding:10px 13px;font-size:10px;line-height:1.5;margin-bottom:18px}
.empty{background:#fff;padding:20px;border-radius:12px;color:var(--cinza)}
@media(max-width:800px){.grid{grid-template-columns:1fr}.header{gap:12px}.brand span{display:none}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <img src="logo-ltj.png" alt="LTJ">
    <div><strong>LTJ Intermediação de Negócios</strong><span>Assinaturas oficiais</span></div>
  </div>
  <a class="back" href="index.html">← Voltar ao Portal</a>
</header>

<main class="wrap">
  <div class="title">
    <h1>Assinaturas de e-mail</h1>
    <div class="line"></div>
    <p>Encontre seu nome e use a assinatura correspondente à sua unidade.</p>
  </div>
  <div class="note">
    Esta página é atualizada pela aba <b>E-MAIL</b> da planilha. Linhas com <b>Ativo = NÃO</b> não aparecem.
  </div>
  <input id="search" class="search" type="search" placeholder="Buscar por nome, setor ou unidade...">
  <section id="grid" class="grid"><div class="empty">Carregando assinaturas...</div></section>
</main>

<script>
const SHEET_ID = "1gRv9T8sq3aJUA30Y9GnqWsMBIr1_C84afXoyCZXjh8w";
const SHEET_NAME = "E-MAIL";
let dados = [];

const norm = s => String(s || "")
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().trim();

const esc = s => String(s || "").replace(/[&<>'"]/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"
}[c]));

function celula(c){
  if(!c) return "";
  if(c.f !== undefined && c.f !== null) return String(c.f);
  if(c.v !== undefined && c.v !== null) return String(c.v);
  return "";
}

window.receberAssinaturasLTJ = function(resp){
  try{
    if(!resp || !resp.table) throw new Error("Resposta inválida");
    const headers = resp.table.cols.map(c => String(c.label || c.id || "").trim());
    dados = resp.table.rows.map(row => {
      const obj = {};
      headers.forEach((h,i)=> obj[h] = celula(row.c ? row.c[i] : null));
      return obj;
    });
    render();
  }catch(e){
    console.error(e);
    document.getElementById("grid").innerHTML =
      '<div class="empty">Não foi possível carregar as assinaturas da planilha.</div>';
  }
};

function carregar(){
  const query = encodeURIComponent("select A,B,C,D,E,F");
  const s = document.createElement("script");
  s.src =
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?sheet=" + encodeURIComponent(SHEET_NAME) +
    "&tqx=responseHandler:receberAssinaturasLTJ" +
    "&tq=" + query +
    "&_=" + Date.now();
  s.onerror = () => {
    document.getElementById("grid").innerHTML =
      '<div class="empty">Não foi possível acessar a planilha de assinaturas.</div>';
  };
  document.head.appendChild(s);
}

function preparar(){
  const ativos = dados.filter(x =>
    norm(x.Ativo) !== "nao" &&
    norm(x.Ativo) !== "não" &&
    String(x.Imagem || "").trim()
  );

  const contagem = {};
  ativos.forEach(x => {
    const k = norm(x.Nome);
    contagem[k] = (contagem[k] || 0) + 1;
  });

  return ativos.map(x => {
    const duplicado = contagem[norm(x.Nome)] > 1;
    let unidade = "";
    if(duplicado){
      const arq = norm(x.Arquivo || x.Imagem);
      unidade = arq.includes("-2") ? "Indaiatuba" : "Sorocaba";
    }
    return {...x, unidade};
  });
}

function render(q=""){
  const g = document.getElementById("grid");
  const f = norm(q);

  const a = preparar()
    .filter(x =>
      norm(x.Nome).includes(f) ||
      norm(x.Setor).includes(f) ||
      norm(x.unidade).includes(f)
    )
    .sort((x,y)=>String(x.Nome||"").localeCompare(String(y.Nome||""),"pt-BR"));

  g.innerHTML = "";

  if(!a.length){
    g.innerHTML = '<div class="empty">Nenhuma assinatura encontrada.</div>';
    return;
  }

  a.forEach(x => {
    const el = document.createElement("article");
    el.className = "card";
    const badge = x.unidade ? `Agente ${esc(x.unidade)}` : "Assinatura oficial";

    el.innerHTML = `
      <div class="cardtop">
        <div>
          <h3>${esc(x.Nome)}</h3>
          <div class="meta">${esc(x.Setor || "")}</div>
        </div>
        <div class="badge">${badge}</div>
      </div>
      <div class="imgbox">
        <img src="${esc(x.Imagem)}" alt="Assinatura ${esc(x.Nome)}" loading="lazy">
      </div>
      <div class="actions">
        <a href="${esc(x.Imagem)}" target="_blank" rel="noopener">Abrir imagem</a>
        <button data-copy="${esc(x.Imagem)}">Copiar link</button>
      </div>`;
    g.appendChild(el);
  });
}

document.getElementById("search").addEventListener("input",e=>render(e.target.value));
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");
  if(!b)return;
  navigator.clipboard.writeText(b.dataset.copy).then(()=>{
    b.textContent="Link copiado!";
    setTimeout(()=>b.textContent="Copiar link",1500);
  });
});

carregar();
</script>
</body>
</html>
