<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assinaturas | Portal LTJ</title>
<style>
:root{--azul:#0640a1;--azul2:#0b54c7;--azul-escuro:#03275f;--laranja:#ff7417;--fundo:#f5f7fb;--cinza:#667085;--borda:#e4eaf2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--azul-escuro)}
a{text-decoration:none;color:inherit}
.header{background:#fff;min-height:95px;display:flex;align-items:center;justify-content:space-between;padding:12px 4.5%;border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:15px} .brand img{width:95px;height:68px;object-fit:contain}
.brand strong{display:block} .brand span{font-size:12px;color:#58677d}
.back{background:var(--laranja);color:#fff;padding:10px 15px;border-radius:9px;font-size:12px;font-weight:bold}
.wrap{padding:28px 4.5% 50px} .title h1{margin:0;font-size:28px} .title p{color:var(--cinza);font-size:13px}
.line{width:42px;height:3px;background:var(--laranja);margin:12px 0 20px}
.note{background:#fff0e3;color:#7b3a00;border-radius:9px;padding:10px 13px;font-size:10px;line-height:1.5;margin-bottom:18px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:15px 16px;box-shadow:0 6px 18px rgba(6,40,95,.04)}
.stat strong{display:block;font-size:23px;margin-bottom:6px} .stat span{font-size:10px;color:var(--cinza)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.filter{border:1px solid var(--borda);background:#fff;color:var(--azul2);padding:8px 12px;border-radius:999px;font-size:10px;font-weight:bold;cursor:pointer}
.filter.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.search{width:100%;max-width:520px;height:46px;border:1px solid var(--borda);border-radius:10px;padding:0 14px;outline:none;margin-bottom:8px}
.result{font-size:10px;color:var(--cinza);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{background:#fff;border:1px solid var(--borda);border-radius:15px;padding:16px;box-shadow:0 6px 18px rgba(6,40,95,.05)}
.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0 0 5px;font-size:15px} .meta{font-size:10px;color:var(--cinza)}
.badge{background:#edf4ff;color:var(--azul2);font-size:9px;font-weight:bold;padding:7px 9px;border-radius:20px;white-space:nowrap}
.dual{display:inline-block;margin-top:7px;background:#fff4e8;color:#7a4b00;padding:5px 7px;border-radius:7px;font-size:9px}
.imgbox{margin-top:12px;border:1px dashed #dce2eb;border-radius:10px;padding:10px;min-height:150px;display:flex;align-items:center;justify-content:center}
.imgbox img{width:100%;max-height:210px;object-fit:contain}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap} .actions a,.actions button{border:1px solid var(--borda);background:#fff;color:var(--azul2);padding:8px 10px;border-radius:8px;font-size:10px;cursor:pointer}
.empty{background:#fff;padding:20px;border-radius:12px;color:var(--cinza)}
@media(max-width:900px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.grid{grid-template-columns:1fr}.brand span{display:none}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><img src="logo-ltj.png" alt="LTJ"><div><strong>LTJ Intermediação de Negócios</strong><span>Assinaturas oficiais</span></div></div>
  <a class="back" href="index.html">← Voltar ao Portal</a>
</header>

<main class="wrap">
  <div class="title"><h1>Assinaturas de e-mail</h1><div class="line"></div><p>Encontre seu nome e use a assinatura correspondente à sua unidade.</p></div>
  <section class="summary">
    <div class="stat"><strong id="nTotal">0</strong><span>Assinaturas disponíveis</span></div>
    <div class="stat"><strong id="nSorocaba">0</strong><span>Agente Sorocaba</span></div>
    <div class="stat"><strong id="nIndaiatuba">0</strong><span>Agente Indaiatuba</span></div>
  </section>

  <div class="filters">
    <button class="filter active" data-filtro="todos">Todos</button>
    <button class="filter" data-filtro="sorocaba">Sorocaba</button>
    <button class="filter" data-filtro="indaiatuba">Indaiatuba</button>
    
  </div>

  <input id="busca" class="search" placeholder="Buscar por nome, setor ou unidade...">
  <div class="result" id="resultado"></div>
  <section class="grid" id="grid"></section>
</main>

<script src="config.js"></script>

let dados = BASE_INTERNA.slice();
let filtroAtual = "todos";

function norm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function preparar(lista){
  const ativos=lista.filter(x=>norm(x.Ativo)!=="nao" && String(x.Imagem||"").trim());
  const cont={};
  ativos.forEach(x=>{const k=norm(x.Nome);cont[k]=(cont[k]||0)+1});
  return ativos.map(x=>{
    const duas=cont[norm(x.Nome)]>1;
    const unidade=norm(x.Arquivo).includes("-2")?"Indaiatuba":"Sorocaba";
    return {...x,duas,unidade};
  });
}

function render(){
  const base=preparar(dados);
  document.getElementById("nTotal").textContent=base.length;
  document.getElementById("nSorocaba").textContent=base.filter(x=>x.unidade==="Sorocaba").length;
  document.getElementById("nIndaiatuba").textContent=base.filter(x=>x.unidade==="Indaiatuba").length;

  const q=norm(document.getElementById("busca").value);
  let lista=base.filter(x=>{
    if(filtroAtual==="sorocaba" && x.unidade!=="Sorocaba") return false;
    if(filtroAtual==="indaiatuba" && x.unidade!=="Indaiatuba") return false;
    return norm(x.Nome).includes(q)||norm(x.Setor).includes(q)||norm(x.unidade).includes(q);
  }).sort((a,b)=>String(a.Nome).localeCompare(String(b.Nome),"pt-BR"));

  document.getElementById("resultado").textContent=lista.length+" assinatura"+(lista.length===1?"":"s")+" exibida"+(lista.length===1?"":"s");
  const g=document.getElementById("grid");
  if(!lista.length){g.innerHTML='<div class="empty">Nenhuma assinatura encontrada.</div>';return}
  g.innerHTML=lista.map(x=>`
    <article class="card">
      <div class="cardtop">
        <div><h3>${esc(x.Nome)}</h3><div class="meta">${esc(x.Setor)}</div>${x.duas?'<div class="dual">2 assinaturas disponíveis</div>':""}</div>
        <div class="badge">${x.unidade?"Agente "+esc(x.unidade):"Assinatura oficial"}</div>
      </div>
      <div class="imgbox"><img src="${esc(x.Imagem)}" alt="Assinatura ${esc(x.Nome)}" loading="lazy"></div>
      <div class="actions"><a href="${esc(x.Imagem)}" target="_blank">Abrir imagem</a><button data-copy="${esc(x.Imagem)}">Copiar link</button></div>
    </article>`).join("");
}

window.receberAssinaturasAPI=function(resp){
  if(resp && resp.ok && Array.isArray(resp.assinaturas)){
    dados=resp.assinaturas;
    render();
  }
};

function tentarAtualizarDaAPI(){
  const api=(window.LTJ_CONFIG && window.LTJ_CONFIG.ASSINATURAS_API_URL)||"";
  if(!api)return;
  const s=document.createElement("script");
  s.src=api+(api.includes("?")?"&":"?")+"acao=assinaturas&callback=receberAssinaturasAPI&_="+Date.now();
  document.head.appendChild(s);
}

document.getElementById("busca").addEventListener("input",render);
document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
  filtroAtual=btn.dataset.filtro;
  document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b===btn));
  render();
}));
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]"); if(!b)return;
  navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent="Link copiado!";setTimeout(()=>b.textContent="Copiar link",1500)})
});

render();
tentarAtualizarDaAPI();
</script>
